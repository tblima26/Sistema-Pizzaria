{% extends 'base-login.html' %}
{% block title %}Novo Usuário{% endblock %}
{% block content %}

<h1 class="text-3xl font-bold text-center mb-2">
    Criar conta
</h1>

<p class="text-center text-zinc-400 text-sm mb-6">
    Cadastre-se para começar.
</p>

{% if error %}
<div class="mb-5 p-3 rounded-lg bg-red-950 border border-red-800 text-red-300 text-sm">
    {{ error }}
</div>
{% endif %}

<form action="" method="POST" class="space-y-5">
    {% csrf_token %}
    
    <div>
        <label for="username" class="block text-sm mb-2 text-zinc-300">
            Nome de usuário:
        </label>
        <input type="text" id="username" name="username" placeholder="Digite seu nome de usuário"
            autocomplete="username" required
            class="w-full p-3 rounded-lg bg-zinc-800 border border-zinc-700 outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition" />
    </div>

    <div>
        <label for="password" class="block text-sm mb-2 text-zinc-300">
            Senha:
        </label>
        <input type="password" id="password" name="password" placeholder="Crie uma senha" autocomplete="new-password"
            required
            class="w-full p-3 rounded-lg bg-zinc-800 border border-zinc-700 outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition" />
    </div>

    <div>
        <label for="confirm_password" class="block text-sm mb-2 text-zinc-300">
            Confirmar senha:
        </label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Digite a senha novamente"
            autocomplete="new-password" required
            class="w-full p-3 rounded-lg bg-zinc-800 border border-zinc-700 outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition" />
    </div>

    <button type="submit"
        class="w-full bg-violet-600 hover:bg-violet-700 active:bg-violet-800 transition p-3 rounded-lg font-semibold">
        Cadastrar usuário
    </button>
</form>

<p class="text-center text-zinc-400 text-sm mt-6">
    Já possui cadastro?
    <a href="{% url 'login' %}" class="text-violet-400 hover:text-violet-300 transition">
        Faça login
    </a>
</p>

{% endblock %}
