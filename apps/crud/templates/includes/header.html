<header
  class="flex items-center justify-between gap-6 border-b border-stone-800 bg-stone-950 px-6 py-2 text-stone-200"
>
  <!-- Logo -->
  <div class="flex shrink-0 items-center gap-3">
    <div
      class="flex h-9 w-9 items-center justify-center rounded-full bg-orange-500/15 text-orange-400"
    >
      <i class="fa-solid fa-pizza-slice" aria-hidden="true"></i>
    </div>

    <div>
      <h1 class="font-semibold text-stone-100">Forno & Massa</h1>
      <p class="text-xs text-stone-500">Sistema de gestão</p>
    </div>
  </div>

  <!-- Menu -->
  <nav class="flex flex-1 items-center justify-center">
    <details class="group relative">
      <summary
        class="flex cursor-pointer list-none items-center gap-2 rounded-md px-3 py-2 text-sm transition-colors hover:bg-stone-800 hover:text-orange-400"
      >
        <i
          class="fa-solid fa-pizza-slice text-orange-400"
          aria-hidden="true"
        ></i>
        Pizzas
        <i
          class="fa-solid fa-chevron-down text-xs transition-transform duration-200 group-open:rotate-180"
          aria-hidden="true"
        ></i>
      </summary>

      <ul
        class="invisible absolute left-0 top-full z-50 mt-1 w-48 origin-top rounded-lg border border-stone-800 bg-stone-900 p-1 opacity-0 shadow-lg shadow-black/20 transition-all duration-200 ease-out group-open:visible group-open:translate-y-0 group-open:opacity-100 -translate-y-1"
      >
        <li>
          <a
            href="{% url 'nova_pizza' %}"
            class="flex items-center gap-2 rounded-md px-3 py-2 text-sm text-stone-300 transition-colors hover:bg-orange-500/10 hover:text-orange-400"
          >
            <i class="fa-solid fa-plus w-4" aria-hidden="true"></i>
            Cadastrar pizza
          </a>
        </li>
      </ul>
    </details>
  </nav>

  <!-- Perfil -->
  <div class="flex shrink-0 items-center">
    <details class="group relative">
      <summary
        class="flex cursor-pointer list-none items-center gap-2 rounded-lg px-2 py-1 transition-colors hover:bg-stone-800"
      >
        <div
          class="flex h-7 w-7 flex-col items-center justify-center rounded-full border border-orange-500/30 bg-orange-500/10 text-orange-400"
        >
          <i class="fa-solid fa-user text-[10px]" aria-hidden="true"></i>
        </div>

        <div>
          <p class="text-xs font-medium text-stone-200">{{ user.username|default:"Administrador" }}</p>
          <p class="text-[10px] text-stone-500">Perfil padrão</p>
        </div>

        <i
          class="fa-solid fa-chevron-down text-[9px] text-stone-500 transition-transform duration-200 group-open:rotate-180"
          aria-hidden="true"
        ></i>
      </summary>

      <ul
        class="invisible absolute right-0 top-full z-50 mt-1 w-40 -translate-y-1 rounded-lg border border-stone-800 bg-stone-900 p-1 opacity-0 shadow-lg transition-all duration-200 ease-out group-open:visible group-open:translate-y-0 group-open:opacity-100"
      >
        <li>
          <a
            href="#"
            class="flex items-center gap-2 rounded-md px-3 py-2 text-xs text-stone-300 transition-colors hover:bg-orange-500/10 hover:text-orange-400"
          >
            <i class="fa-solid fa-user w-3" aria-hidden="true"></i>
            Minha conta
          </a>
        </li>
        <li>
          <a
            href="/logout/"
            class="flex items-center gap-2 rounded-md px-3 py-2 text-xs text-stone-400 transition-colors hover:bg-stone-800 hover:text-stone-100"
          >
            <i
              class="fa-solid fa-right-from-bracket w-3"
              aria-hidden="true"
            ></i>
            Sair
          </a>
        </li>
      </ul>
    </details>
  </div>
</header>
