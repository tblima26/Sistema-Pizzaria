
{% extends 'base-crud.html' %}

{% block title %}Nova Pizza | Forno & Massa{% endblock %}

{% block content %}

<div class="py-4">
  <div class="mb-5 flex items-center gap-3">
    <a
      href="{% url 'index' %}"
      class="flex h-9 w-9 items-center justify-center rounded-lg border border-stone-700 bg-stone-800 text-stone-300 transition duration-200 hover:border-stone-600 hover:bg-stone-700 hover:text-stone-100 focus:outline-none focus:ring-2 focus:ring-stone-500"
      aria-label="Voltar"
      title="Voltar"
    >
      <i class="fa-solid fa-arrow-left text-sm"></i>
    </a>

    <div>
      <h1 class="text-lg font-semibold text-stone-100">Nova Pizza</h1>
      <p class="text-xs text-stone-400">
        Cadastre uma nova pizza no sistema.
      </p>
    </div>
  </div>

  <form
    action="{% url 'nova_pizza' %}"
    method="post"
    class="mx-auto max-w-xl space-y-3 rounded-xl border border-stone-800 bg-stone-900 p-4 shadow-sm"
  >
    {% csrf_token %}

    {% include 'includes/form.html' %}

    <div class="flex justify-end border-t border-stone-800 pt-3">
      <button
        type="submit"
        class="inline-flex items-center gap-2 rounded-lg border border-amber-500/30 bg-amber-500 px-4 py-2 text-sm font-semibold text-stone-950 shadow-sm transition duration-200 hover:bg-amber-400 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 focus:ring-offset-stone-950"
      >
        <i class="fa-solid fa-plus text-xs"></i>
        Salvar pizza
      </button>
    </div>
  </form>
</div>

{% endblock %}
